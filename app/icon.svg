<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Shawon Ahmed">
  <!--
    A playhead marker over a clip: the site's own transport bar, reduced to
    two shapes.

    No stem. The first version had the triangle descending into a thin stem
    that met a base line, which at any size read unmistakably as a martini
    glass. A wide, squat triangle separated from the bar reads as a marker;
    a tall flared one over a stem reads as stemware.

    Sized for 16px first, not 64. At a tab's 16px this grid scales by 0.25,
    so nothing here is under 5 units — anything thinner lands on a half pixel
    and greys out. The ground is solid because tab bars come in both colours
    and a bone mark would disappear on a light one.
  -->
  <rect width="64" height="64" rx="14" fill="#0e1210" />
  <path d="M13 16h38L32 36Z" fill="#edf2ee" />
  <rect x="20" y="43" width="24" height="6" rx="3" fill="#e8935a" />
</svg>
